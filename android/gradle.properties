org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError

# Workaround for a Windows-only Kotlin plugin build failure:
#
#   Could not close incremental caches in build/android_<plugin>/kotlin/...:
#   class-fq-name-to-source.tab, source-to-classes.tab
#
# The Kotlin incremental cache files end up locked (typically by a virus scanner
# touching the freshly written .tab files), which fails the whole release build.
# Running the Kotlin compiler in-process and without incremental caches avoids the
# cache files entirely. Release builds are already dominated by Dart AOT and R8,
# so the cost of a full Kotlin recompile is a few seconds.
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
kotlin.incremental=false
kotlin.compiler.execution.strategy=in-process
